# The `Adg` agent preset: 调度智能体（dispatcher）+ 一个通用子代理（多智能体模式）。
#
# 本文件是这份 preset 的**唯一真相源**：改 preset 就是改它。生成物由
# `node tools/gen-preset-bundle.mjs` 产出（在 `.gitignore` 里），**不许手改**。
# 设计口径与不变量见 `preset/design.md`；改动入口与校验见 `preset/AGENTS.md`；
# 增删委派能力见技能 `adg-delegation`（`${DSH_HOME:-~/.dsh}/skills/adg-delegation/SKILL.md`）；
# 未观测项（含量法）见 `preset/design.md` 的「For Agents」一节。
#
# This file is an AGENT-PLANE composition: the roster mounts it ONCE under a standing scope, and
# every session naming it joins by scope parentage, so the tools and prompt sections registered
# here cover each joined agent. The host composition (`base.cordis.yml` + `web.cordis.yml`) keeps
# what a preset must not own: the registries, the sandbox and approval stack, persistence, and the
# model route.
#
# 编辑红线（违反即返工；每条都有实测或源码依据，理由见 `preset/design.md` 的非功能红线）：
#   1. 不写通用 `subagent` / `subagent_fork` 行：子代理会继承整套组合，一旦有通用行，
#      子代理就能绕过自己的范围再开一个不受限的子代理。
#   2. 委派行的 `toolFilter` 是**挂载期**写死的：能力面要按任务现配，所以 `agent` 行
#      刻意不写它 —— 过滤由 `delegate` 的 `tools` 在每次委派时落下（toolFilter 是交集、
#      只减不增，动态传的就是最终面）。`tools` 里只能写已注册的工具名 ——
#      未知名会让**那一次委派**抛 `names unknown global tool ...`（不是挂载失败）。
#   3. 承载体积旋钮的三行（`compaction-basic` / `tool-result-pruner` / `tool-web`）**不写 config**：
#      截断工具结果会把工具已经取到的事实切掉，一律用插件出厂默认值。
#   4. 拿到 `pwsh` 的委派必须同时给 `job_list` / `job_output` / `job_kill`。
#   5. 不给委派行写 `maxDepth`（写 0 会让每一次委派失败），也不给任何请求写
#      `maxTokens` / `agentOptions` / `reasoningEffort`。
#   6. `delegate` 的 `tools` 里不写 `workflow` / `ralph`，也不写 `skill`。
#   7. 构建期注入的工具名（billion-context 的 `compress` / `decompress` / `search_context` /
#      `acp_status`，save-token 的 `save_token_expand`）与 `compaction-basic` 的 `config.auto`
#      只能由 `tools/gen-preset-bundle.mjs` 按探测结果注入（清单在 `tools/flavors.mjs`），
#      不许手写进本文件 —— `tools/check-preset.mjs` 会把它们判成 ERROR。
#   8. 调度 persona 的**约束**与**验收标准**两段是踩过的坑换来的：条目不许删，也不许改写成
#      分步流程、固定字段表或字数预算（逐条判据见 `preset/testing-guide.md`）。
#   9. composition 里每个 `@deepseek-ai/*` 包名要对着当前安装核对：沿用旧名会让 registry 判
#      整份 preset `broken`（`… never started`），Adg 模式在新会话里直接不可用。
#      核对判据：`node tools/check-preset.mjs` 退 0，且真实挂载后 `agentPresets.resolve('adg-ptc')`
#      的 `.broken` 为空。
#
# 唯一的委派行 = `delegation` 组里的 `agent` 行：不写 persona、不写 toolFilter、不写 maxDepth。
# 子代理的目标 / 边界由调度者在委派里写（persona 只在需要专门视角时才给），能力面由
# `delegate` 的 `tools` 决定，`backgroundMode: continuable` 让它后台接续干活
# （结果以结算通知回到调度者）。
#
# 一个 service 行必须坐在带 `isolate` realm 的组里：否则它发布到 root realm、成为进程级实例，
# 与别的 preset 撞名（`dsh-agent-presets` 在挂载时拒绝）。`true` 表示 entry-local realm。
# （A shared label does NOT pool instances — labels join REALMS, and a second `provide()` under
# the same realm symbol throws; an entry-local realm is what this file needs.）

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` resolves from the agent's own route.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是精通 Harness 的超级智能，你对任何任务，都会先明确要做什么、不要做什么、验收标准，并在任务执行过程中动态调整，做到可闭环验证：能程序化验证的就写程序验证，不能的就使用独立子代理进行验证，实在拿不准的让用户决断。
      
      ## 无限预算环境
      
      本环境token预算无限。
      
      ## 第一原则：人类可读性优先
      
      任何面向用户的输出一律简洁明了说人话；对于首次出现的名词给出奶奶来了也能看懂的解释；输出排版优雅美观。
      
      ## 子代理
      【何时派】子代理是上下文独立的，因此它可以提供一些意想不到的全新视角；子代理不会受到你的或其他子代理的上下文污染，因此可以做对抗审查；多个子代理是并发的，因此可以提供任务的并发执行能力；子代理可使用的工具受你delegate指派的约束，因此可以通过限制子代理的能力面，约束其行为范围……你需要在适合的时机使用子代理。
      
      【派遣原则】每个子代理的工作都必须约束好范围，结果可闭环验证。
      
      【如何派】你手上的子代理只有一个：通用子代理 `agent`，它的能力面由你每次 delegate 时现定。
      `agent` 本身不带固定职责，也没有 persona：它干什么、能用哪些工具，全看你这次委派里写给它的目标与边界。委派在程序里用 `await tools.delegate({ description, prompt, tools, persona })`（`background` 不要设）：`tools` 是它这次可见/可调用的全部工具，省略该字段 = 继承你能执行的全部 tools，`tools` 里**不写 `run_code`**（平台对它是硬抛错，`delegate` 会当场拒绝整次委派）；`persona` 只在需要专门视角时才给。
      委派一律后台发出（`delegate` 默认后台，不要设 `background: false`）：只有后台的 continuable 子代理才是活的 —— 能接续、能被用户 steer；前台会把它降级成一次性运行，接续与复用全部失效。后台不等于丢结果：`await tools.delegate({...})` 立刻返回子代理 id，它结束时结算通知会带着收尾正文把你唤起 —— 如果你没有事干就结束本轮，不要写 sleep 或轮询等它跑完。
      
      【何时续做】合并的判据是**材料重叠**而不是"同一个实体"：后一件事要不要读前一件**已经读进来的那份材料**？要 ⇒ 合并成一条（省的是同一份材料被从头读 N 遍）；不要、或只需读一小块 ⇒ 拆开并行更省。同一实体的**只读侦察**因此可以多路并行，每条只服务一个方面、相邻面写进「本次不做」；同一实体的**写入与交互**保持单写者（竞态、登录态、材料重读都在这里）；验证一律另派，且不继承写者的编辑内容与实现说明。材料本身变了、上一个已跑偏、或需要新工具面时也拆开重派。
      要重开子代理时先看 `list_agents` 里有没有已经读过它的那个它：`send_message` 对正在工作的子代理恒为 steer（插进它当前轮的下一步）—— 同一件事的修正/补充现在就发；同一实体上的另一件事不要插进去，待子代理结束本轮、等结算通知把你唤起后再接给同一个它。只有实体或性质不同、材料本身变了、上一个跑偏越界、或要接给还不持有材料的子代理时才新建委派。
      
      【技能】要用技能的工作照常委派，但只给技能的绝对路径 +「先用 `tools.read` 读该文件再动手」，不要内联、不要复述技能正文（技能面只归你）。技能名册你自己用 `await tools.skill({...})` 查；技能正文不进你的上下文。
      
      【提问】子代理也能自己提问：你在委派里给了 `ask_user` 的子代理，撞上登录墙 / 验证码 / 必须有人拍板的岔路时会**直接问用户**（那一问以你的名义进提问服务、落在你这个会话里，你与用户都看得见），答复直接回到它手上，它当场接着干 —— 所以别指望它一定先回来找你；要不要给 `ask_user` 由你在委派时定，纯机械、不该打扰用户的长任务可以不给（给 `notify_user` 让它单向喊一声就够）。

      ## 约束

      【进度汇报】每取得一段进展就用**一句话**告诉用户（面向用户的输出，而不是思考块）：完成了什么、接下来做什么。

      【不确定就问】任务中任一处需要用户拍板、或你自己没把握，就用提问工具向用户提问。向用户提问时，将 run_code 超时时间设置为9999999，避免用户没有时间仔细思考；万一这段程序超时，那就不使用提问工具，而是进行问题输出，待用户看到后再回复。
      
      ## 优雅、审美
      
      结果优雅：可删性：再删掉任何一个元素、步骤、字段、注释、动效，信息与功能都不损失，那么它本来就不该在。优雅 = 删到不能再删，作品仍然成立。外行过：结论前置，术语一出现就给一句人话，结构一眼可循。外行看不懂是作者的问题，不是外行的问题。内行过：细节经得起追问 —— 数字有来源，边界说清楚，取舍写明理由。门道在取舍的自觉，不在堆复杂度。一致性：同一概念只用一个名字，同一类信息只用一种排法，同一动作只走一条路径。系统感来自一致，不来自装饰。
      过程优雅：走直线：达成同一目的的最短步骤。不做"为保险起见"的重复动作、复述、重验。没有多余动作：一次拿够、一次改对、一次说清。返工是最贵的丑。干净收尾：留下可复现的状态，不制造别人替你收拾的现场 —— 临时文件、半成品命名、遗留调试代码、未删的中间产物。
      交付前问自己：1. 还能删吗？删掉这个元素 / 步骤，信息真的会少吗？2. 两个人看：外行三秒能拿到结论吗？内行追三层还站得住吗？3. 换个人接手：命名、结构、注释自洽到能维护吗？

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── 呈现模式：PTC ───────────────────────────────────────────────────────────
#
# 本 preset 与前身 `Adg 多智能体模式` 的**唯一机制差异**就是这一行：调度者与它派出的
# 子代理都不再直呼原生工具，而是只看到 `run_code` —— 模型写一段 async TypeScript 程序体，
# 在程序里用 `await tools.<工具名>({...})` 批量调工具。
#
# 为什么值这一行：
#   - 固定开销从"每个工具一份 JSON schema + 说明"压成"一份 SDK 契约"，工具越多省得越多；
#   - 中间结果留在程序局部、不进对话，只有 `return` / `console.log` 的那一点进上下文；
#   - 串/并行由模型在一次程序里自己编排，不占对话轮次。
#
# 声明落在**挂载 scope**上（`ctx.tools.presentAs('ptc')`）：preset 的常驻挂载覆盖每个加入
# 它的 agent，子代理按 scope parentage 一并变 PTC —— 所以子代理也只能经 `run_code` 调工具。
# 一个 agent 只许声明一次（第二次被拒）；缺 `ctx.ptcRuntime` 时本行停在 pending，
# `dsh-agent-preset-registry` 会**指名本 id 拒绝挂载整份 preset**（不是等第一条 prompt）。
# 运行时由 host 组合提供：`dsh-base/cordis.patch.yml` 的 `- id: ptc-runtime`
# （`@deepseek-ai/dsh-ptc-runtime-node`），本文件不重复声明。
#
# `tools/check-preset.mjs` 的 EXPECTED_ROWS 里有一条 spec 守着本行（包名 + `mode: ptc`）。
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: ptc

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals（整段摘掉）───────────────────────────────────────────────────────

# 原 `command-goal`（人类命令 `/goal`）与 `tool-goal`（模型面 `create_goal` /
# `get_goal` / `update_goal`，合计 1,573 字符）两行按「减少固定上下文」的目标一起摘掉。
# 为什么**两行一起**摘：`/goal` 的语法只有 `<objective>` / `clear` / `edit <objective>` /
# `pause` / `resume`（`dsh-command-goal` 的 USAGE），**收尾（complete）只能由模型用
# `update_goal` 做**；只摘 tool 行会留下一条"能建、能暂停、没人能收尾"的命令，
# 目标会一直停在 active 直到用户 `clear` —— 那是半残状态，不如整段摘。
# 目标域本身（goal service + session driver）仍在 host 平面，本改动不碰它们。
# 要把 goals 加回来：还原上面那两行（`@deepseek-ai/dsh-command-goal` /
# `@deepseek-ai/dsh-tool-goal`），并同步 `tools/check-preset.mjs` 的 KNOWN_TOOLS
# 与技能 `adg-delegation` 的能力带清单。

# ── plan mode（整段摘掉）────────────────────────────────────────────────────

# 原 `planning` 组（`cordis:group` + `isolate: {planMode: true}` + 一行
# `@deepseek-ai/dsh-plan-mode` 带约 4.5K 字符的 section）整段摘掉。两个理由：
# ① 本 preset 用不上它，而它自带一条**在 PTC 下不可能满足**的硬约束 —— section
#    末段要求 "Make exit_plan_mode the only and final tool call in that assistant
#    response"，而 PTC 呈现下模型只看得见 `run_code`，只能在程序里
#    `await tools.exit_plan_mode(...)`，做不到"唯一且最后一个工具调用"；
# ② 成本形态与「减少固定上下文」不符：section 只在 plan mode 激活时注入
#    （`dsh-plan-mode` 的 `return ... active ? this.section : ""`），但
#    `exit_plan_mode` 工具与 `/plan` 命令**常驻注册**，非激活时仍占一条工具
#    schema 与一段工具说明。
# 摘掉**不等于**会话里没有 plan mode：host 组合（`@deepseek-ai/dsh-base` 的
# `cordis.patch.yml`）自己就有一行 `- id: plan-mode` / `name:
# '@deepseek-ai/dsh-plan-mode'`，`/plan` 与 `exit_plan_mode` 由那一份提供，
# section 换成 deployment 版本文本。本 preset 不再重复挂载一份。
# 要把 plan mode 加回本 preset：把本注释块换回原来的 25 行（`planning` 组 +
# `isolate: {planMode: true}` + `- id: plan-mode` 一行），并复核 section 末段
# 那条 PTC 下做不到的约束。

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# 源文件里这两行**刻意不写 config**：压缩阈值与单条工具结果的截断长度一律用插件出厂默认值
# （compaction-basic 的 0.8 / 0.16，pruner 的 8192 / 4096 / 1024）。
# 压低这些值是错的：**信息会被切掉** —— 工具已经取到的事实被裁掉后，
# 模型只能重取或猜，净效果是把省下的 token 换成更差的结论。
# 以后若确实要覆盖，插件在加载时会校验：两个 ratio 必须落在 (0,1] 且
# retainRatio < thresholdRatio；pruner 必须满足 head + 标记 + tail ≤ threshold ——
# 写错不是静默生效，而是整行挂载时直接抛错。
#
# 唯一一个**构建期注入**的键是 `compaction-basic` 的 `auto`：挂了 billion-context 的 profile 里
# 生成物会带上 `config: {auto: false}`（`tools/gen-preset-bundle.mjs --with-billion-context`；注入组
# 清单在 `tools/flavors.mjs`，两组里**只有** billion-context 要求关自动压缩 —— save-token 组只往
# allow 里加工具名，不碰任何旋钮），
# 取值与 billion-context 自己的补丁（它的 `package.json` 声明 `dsh.bundle.patch = ./dsh.bundle.patch.yml`，
# 里面是 `- id: compaction-basic` / `config: {auto: false}`）一致。为什么要在这儿再写一遍：那份官方补丁
# 打在 profile 层，而本 preset 的 compaction 三行活在 `isolate: {compaction: true}` 的 realm 里、
# 是另一份实例；写进 preset 自己的组里就不依赖那份补丁能不能命中这个 realm
# （两边都生效也无行为差异）。
# 语义是「关掉自动压缩与溢出恢复，手动 `/compact` 仍可用」（该插件 README 的 `auto` 行：
# "set `false` for manual-only operation"），不是把这一行 `disabled` 掉。
# **这个键不许写进本文件**：没挂 bili 的 profile 里，dsh 自带的自动压缩是唯一的压缩手段，
# 写死 `false` 等于让那些 profile 的上下文无限增长（`tools/check-preset.mjs` 会直接报错）。
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

# ── 委派：一个通用智能体实例 + 每次委派现定能力面 ────────────────────
    # 这里只有**一行** @deepseek-ai/dsh-tool-subagent（`id: agent`、`toolName: agent`），
    # 它是调度智能体唯一的委派入口。**没有固定专家名册**：子代理干什么、能用哪些工具、
    # 带不带 persona，全部由调度智能体在**每一次委派时**决定（工具 `delegate`）。
    # 理由：`dsh-tool-subagent` 实例的 toolFilter / persona 是**挂载期**写死的，
    # 一个实例只能服务一种固定能力面；要"边开发边自验"就得按任务现配能力面。
    #
    # 这一行刻意**不写** `persona`、**不写** `toolFilter`：
    #   - 不写 persona —— 子代理默认没有 persona；要就由 `delegate` 的 `persona` 逐次给。
    #   - 不写 toolFilter —— 省略时子代理继承本组合的全部工具；`delegate` 的 `tools` 参数
    #     是唯一一层过滤（toolFilter 是交集、只减不增，所以动态传的就是最终面）。
    #   - 不写 maxDepth —— 出厂默认就是 1（一跳可达）。写 0 会让**每次**委派抛
    #     `subagent depth 1 exceeds maxDepth 0`。
    #
    # 「一跳可达」怎么保住：委派工具 `delegate` 由第一方插件 `adg-delegate` 装在每个 profile 的
    # **全局层**（不在本文件里，装没装以 profile 为准；要重新生成/重装才有）。它的内置 deny 名单
    # 里有 `agent`，子代理的工具目录里因此没有这个入口 —— 子代理开不了子代理。
    # 就算它绕过去了，平台的深度闸门也会当场抛 `subagent depth 2 exceeds maxDepth 1`。
    #
    # 关于工具面的事实：
    #   1. toolFilter 裁的是**继承来的**工具；子代理自己那层注册的结构化输出工具与
    #      run_code 不受影响。
    #   2. `delegate` 的 `tools` 里只能写**已注册**的工具名：dsh-tools 的 restrict() 对未知名
    #      会直接抛错（`names unknown global tool ...`）。还要留意条件性注册：`bash` 在 Windows
    #      上被 disabled 行关掉、`read_image` 依赖 attachments 服务（base 组合里恒有）、
    #      disabled 的 codex/claude-code 行同理 —— 名字缺失的后果是"**这一次委派**失败"，
    #      不是挂载失败。有 pwsh 的委派要同时给 job_list / job_output / job_kill，
    #      否则"后台跑了但取不回来"。
    #   3. 本文件里**不许**出现任何**构建期注入**的名字：两个注入组（billion-context 的
    #      compress / decompress / search_context / acp_status、save-token 的 save_token_expand）
    #      由别的 bundle 注册在**全局层**，装了才存在，所以只由 `node tools/gen-preset-bundle.mjs`
    #      按目标 profile 注入（清单唯一来源 `tools/flavors.mjs`，见 AGENTS.md 红线 10）。
    #
    # 为什么没有通用 `subagent` / `subagent_fork` 行：子代理继承父代理这套 composition，
    # 一旦保留通用行，子代理就能绕过自己的范围再开一个不受限的子代理；上面那条对 `agent`
    # 的动态 deny 才是替代品。新增**委派能力**不需要动这份名单（能力面由 `delegate` 逐次
    # 决定）；只有要改委派机制本身时才动这个文件。完整步骤见技能 `adg-delegation`。

    - id: agent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: agent
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    # 编排引擎三行（`workflow-ptc` 引擎 + `tool-workflow` / `tool-ralph`）**已摘掉**：
    # 它们给调度智能体每次请求加 ~4,110 字符的工具目录（`workflow` 3,331 + `ralph` 779），
    # 而 Adg 模式的主路径是 `delegate` —— 编排引擎是可选件，摘掉不影响委派机制本身。
    # 摘掉后的两条派生事实：
    #   - `workflow` / `ralph` 现在**没人注册**：写进任何 `allow` 或 `delegate` 的 `tools`
    #     不再"策略越界"，而是那一次委派抛 `names unknown global tool ...`
    #     （`tools/check-preset.mjs` 的 SCHEDULER_ONLY 里已随之删掉这两个名字）。
    #   - `delegate` 的 `BUILTIN_DENY` 里**仍然留着** `workflow` / `ralph`（见
    #     `delegate/lib/delegate.mjs`）：名字不存在时 deny 是空的但无害，而万一引擎行被
    #     加回来，那道闸门已经就位（`tools/check-preset.mjs` 的 EXPECTED_DENIED_FOR_CHILDREN
    #     仍在核对这两个名字在不在名单字面量里）。
    # 组上的 `isolate: {workflowEngine: true}` **刻意保留**：将来把引擎行加回来时，它们仍然
    # 落在同一个 entry-local realm 里，不会转去解析 host 平面那份 registry。

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
#
# 这里**刻意不压低**三个体积上限（fetchMaxOutputChars / searchMaxResults /
# searchMaxQueries）：截断工具输出会把工具已经取到的事实切掉，模型只能重取或猜 ——
# 净效果是把省下的 token 换成更差的结论。web_fetch 是子代理里最大的单一上下文
# 来源，但"大"不等于"该砍"：砍掉的正是调研型委派唯一需要的东西。
# 三个键都回到 tool-web 出厂默认值（200000 / 8 / 4）；`searchTimeoutMs` 不是体积旋钮，
# 保留 60s 是为了让多查询检索不被默认的 30s 掐掉。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
